[project]
name = "meda-agent-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "sqlmodel>=0.0.22",
  "rank-bm25>=0.2.2",
  "beautifulsoup4>=4.12.0",
  "alembic>=1.13.0",
  "pyjwt>=2.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# `bench` is excluded by default because those tests assert wall-clock timings and
# run-to-run variance; CI runs them in the dedicated backend-benchmark job with
# continue-on-error, so they were never a gate. Run them via: pytest -m bench
addopts = '-p no:warnings --strict-markers -m "not needs_network and not bench"'
asyncio_mode = "auto"
markers = [
    "needs_network: 标记需要真实外网的测试，默认 skip。运行：pytest -m needs_network",
    "needs_browser: 标记需要真实浏览器的测试，默认 skip。运行：pytest --runeedsbrowser -m needs_browser",
    "bench: SLO tests that run only in backend-benchmark job",
    "asyncio: pytest-asyncio marker for async tests (pytest-asyncio>=1.4.0 auto-registered, explicit for --strict-markers)",
    "parametrize: built-in pytest parametrize marker, explicit for --strict-markers",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
