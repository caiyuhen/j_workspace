[project]
name = "meda-agent-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "sqlmodel>=0.0.22",
  "rank-bm25>=0.2.2",
  "beautifulsoup4>=4.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = '-p no:warnings --strict-markers -m "not needs_network"'
markers = [
    "needs_network: 标记需要真实外网的测试，默认 skip。运行：pytest -m needs_network",
]
