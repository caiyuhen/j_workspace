# MedAIagents 全局配置文件
# Configuration file for MedAIagents

# LLM 模型配置
llm:
  # 默认使用的提供商
  default_provider: openai

  # 提供商配置
  providers:
    # CherryIn OpenAI 兼容 API
    openai:
      api_key: ${CHERRYIN_API_KEY}
      base_url: https://open.cherryin.net/v1
      default_model: deepseek/deepseek-v4-flash
      temperature: 0.3
      max_tokens: 4096

    # Anthropic Claude (如配置了 API Key 可启用)
    # anthropic:
    #   api_key: ${ANTHROPIC_API_KEY}
    #   default_model: claude-3-sonnet-20240229
    #   temperature: 0.3
    #   max_tokens: 4096

    # DeepSeek (如配置了 API Key 可启用)
    # deepseek:
    #   api_key: ${DEEPSEEK_API_KEY}
    #   base_url: https://api.deepseek.com/v1
    #   default_model: deepseek-chat
    #   temperature: 0.3
    #   max_tokens: 4096

# 医学知识库配置
knowledge:
  # 向量数据库提供商: milvus / simple
  vector_db_provider: simple

  # PubMed 搜索配置
  pubmed:
    enabled: false
    email: ""  # NCBI 要求的联系邮箱

# 安全与合规配置
security:
  # 数据加密密钥文件路径
  encryption_key_file: ./data/encryption.key

  # RBAC 数据库路径
  rbac_db: ./data/rbac.db

  # 审计日志数据库路径
  audit_db: ./data/audit.db

# 记忆系统配置
memory:
  # 存储类型: sqlite / redis
  storage_type: sqlite
  sqlite_path: ./data/memory.db

# 医学影像配置
imaging:
  # DICOM 文件存储路径
  dicom_storage_path: ./data/dicom

# 生物信息学配置
bioinformatics:
  # 基因组数据存储路径
  genomic_data_path: ./data/genomics
