llm:
  default_provider: cherryin
  providers:
    cherryin:
      api_key: ${CHERRYIN_API_KEY}
      base_url: https://open.cherryin.cc/v1
      default_model: deepseek/deepseek-v4-flash
      temperature: 0.3
      max_tokens: 4096
      available_models:
      - id: deepseek/deepseek-v4-flash
        name: DeepSeek V4 Flash
        description: DeepSeek 快速版，适合日常对话
      - id: deepseek/deepseek-ocr
        name: DeepSeek OCR
        description: DeepSeek 视觉 OCR 模型
      - id: qwen/qwen3-235b-a22b-instruct-2507
        name: Qwen3 235B A22B
        description: 阿里通义千问旗舰版
      - id: qwen/qwen-image-edit-2509
        name: Qwen Image Edit
        description: 阿里通义千问图像编辑
      - id: qwen/qwen3.5-27b
        name: Qwen 3.5 27B
        description: 阿里通义千问 3.5
      - id: qwen/qwen3-vl-30b-a3b-thinking
        name: Qwen3 VL 30B Thinking
        description: 阿里通义千问视觉推理版
      - id: BAAI/bge-reranker-v2-m3
        name: BGE Reranker v2
        description: BAAI 重排序模型
      - id: bytedance/seed-oss-36b-instruct
        name: ByteDance Seed 36B
        description: 字节跳动 Seed 模型
      - id: stepfun-ai/step-3.5-flash
        name: StepFun Step 3.5 Flash
        description: 阶跃星辰 Step 模型
      - id: openai/gpt-4o
        name: GPT-4o
        description: OpenAI 多模态模型
knowledge:
  vector_db_provider: simple
  pubmed:
    enabled: false
    email: ''
security:
  encryption_key_file: ./data/encryption.key
  rbac_db: ./data/rbac.db
  audit_db: ./data/audit.db
memory:
  storage_type: sqlite
  sqlite_path: ./data/memory.db
imaging:
  dicom_storage_path: ./data/dicom
bioinformatics:
  genomic_data_path: ./data/genomics
