          };
          if (window.syncCTMSDataFromPostgreSQL) {
            await window.syncCTMSDataFromPostgreSQL();
          }
          
          // 在控制台输出临时保存的 user_token（调试用，用于已有登录状态时）

            console.log('--- Debug: User Auto Login ---');
            console.log('user_token:', userToken);
          }

          mountMainLayout();
          return;
        }
      } catch (e) {
        if (window.CTMS_API) CTMS_API.Token.clearTokens();
      }
      renderLogin();
    }

    bootstrapApp();

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && document.getElementById('login-screen').innerHTML) {
        doLogin();
      }
