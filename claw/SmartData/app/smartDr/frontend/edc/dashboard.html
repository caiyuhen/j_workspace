<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDC系统 - 表单设计</title>
    <link rel="stylesheet" href="../auth/styles.css">
    <style>
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .section-title {
            color: #333;
            margin: 20px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .template-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin: 15px 0;
            transition: all 0.3s ease;
        }
        
        .template-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }
        
        .template-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5a6fd8;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c82333;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        
        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 500px;
        }
        
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .close:hover {
            color: black;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        
        .designer-container {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 20px;
            margin: 20px 0;
            background: white;
        }
        
        .component-toolbar {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .component-item {
            padding: 8px 15px;
            background: #667eea;
            color: white;
            border-radius: 5px;
            cursor: move;
            user-select: none;
        }
        
        .form-designer {
            min-height: 300px;
            border: 2px dashed #ccc;
            border-radius: 5px;
            padding: 20px;
            position: relative;
        }
        
        .form-element {
            border: 1px solid #667eea;
            border-radius: 5px;
            padding: 10px;
            margin: 10px 0;
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>EDC系统</h1>
            <p>电子数据采集系统</p>
        </div>
        
        <div class="dashboard-container">
            <div class="action-buttons" style="margin-bottom: 20px;">
                <button class="btn btn-primary" onclick="openCreateTemplateModal()">创建模板</button>
                <button class="btn btn-success" onclick="location.href='/auth'">返回登录</button>
            </div>
            
            <h2 class="section-title">表单模板列表</h2>
            
            <div id="templatesContainer">
                <div class="template-card">
                    <div class="template-header">
                        <h3>不良事件报告</h3>
                    </div>
                    <p><strong>描述:</strong> 标准不良事件报告表单</p>
                    <p><strong>创建时间:</strong> 2024-01-15</p>
                    <div class="action-buttons">
                        <button class="btn btn-success" onclick="designForm('AE')">设计表单</button>
                        <button class="btn btn-primary">编辑</button>
                        <button class="btn btn-danger">删除</button>
                    </div>
                </div>
                
                <div class="template-card">
                    <div class="template-header">
                        <h3>生命体征记录</h3>
                    </div>
                    <p><strong>描述:</strong> 常规生命体征记录表单</p>
                    <p><strong>创建时间:</strong> 2024-02-01</p>
                    <div class="action-buttons">
                        <button class="btn btn-success" onclick="designForm('LB')">设计表单</button>
                        <button class="btn btn-primary">编辑</button>
                        <button class="btn btn-danger">删除</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 创建模板模态框 -->
        <div id="createTemplateModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeCreateTemplateModal()">&times;</span>
                <h2>创建新表单模板</h2>
                <form id="createTemplateForm">
                    <div class="form-group">
                        <label for="templateName">模板名称 *</label>
                        <input type="text" id="templateName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="templateDescription">模板描述</label>
                        <textarea id="templateDescription" class="form-control"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="templateType">模板类型</label>
                        <select id="templateType" class="form-control">
                            <option value="ae">不良事件 (AE)</option>
                            <option value="lb">生命体征 (LB)</option>
                            <option value="dm">研究药物 (DM)</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">创建模板</button>
                        <button type="button" class="btn btn-danger" onclick="closeCreateTemplateModal()">取消</button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- 表单设计器模态框 -->
        <div id="formDesignerModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeFormDesignerModal()">&times;</span>
                <h2>表单设计器 - <span id="designerTemplateName">模板名称</span></h2>
                
                <div class="designer-container">
                    <h3>组件工具栏</h3>
                    <div class="component-toolbar">
                        <div class="component-item" draggable="true">文本框</div>
                        <div class="component-item" draggable="true">下拉框</div>
                        <div class="component-item" draggable="true">日期选择器</div>
                        <div class="component-item" draggable="true">复选框</div>
                        <div class="component-item" draggable="true">单选框</div>
                    </div>
                    
                    <h3>表单设计区域</h3>
                    <div class="form-designer" id="formDesignerArea">
                        <p>拖拽组件到此区域以设计表单</p>
                    </div>
                </div>
                
                <div style="margin-top: 20px; text-align: center;">
                    <button class="btn btn-success">保存表单</button>
                    <button class="btn btn-danger" onclick="closeFormDesignerModal()">取消</button>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>&copy; 2026 EDC系统. 保留所有权利.</p>
        </div>
    </div>

    <script>
        // 打开创建模板模态框
        function openCreateTemplateModal() {
            document.getElementById('createTemplateModal').style.display = 'block';
        }
        
        // 关闭创建模板模态框
        function closeCreateTemplateModal() {
            document.getElementById('createTemplateModal').style.display = 'none';
            document.getElementById('createTemplateForm').reset();
        }
        
        // 打开表单设计器模态框
        function designForm(templateName) {
            document.getElementById('designerTemplateName').textContent = templateName;
            document.getElementById('formDesignerModal').style.display = 'block';
        }
        
        // 关闭表单设计器模态框
        function closeFormDesignerModal() {
            document.getElementById('formDesignerModal').style.display = 'none';
        }
        
        // 提交创建模板表单
        document.getElementById('createTemplateForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('templateName').value,
                description: document.getElementById('templateDescription').value,
                type: document.getElementById('templateType').value
            };
            
            // 保存到本地存储测试
            alert('模板已创建 (模拟功能)');
            closeCreateTemplateModal();
        });
        
        // 页面加载完成后添加删除按钮事件
        document.addEventListener('DOMContentLoaded', function() {
            // 为所有删除按钮添加事件
            const deleteButtons = document.querySelectorAll('.btn-danger');
            deleteButtons.forEach(button => {
                button.addEventListener('click', function() {
                    if (confirm('确定要删除这个模板吗？')) {
                        alert('模板已删除 (模拟功能)');
                    }
                });
            });
            
            // 添加拖拽功能
            const components = document.querySelectorAll('.component-item');
            const designerArea = document.getElementById('formDesignerArea');
            
            components.forEach(component => {
                component.addEventListener('dragstart', function(e) {
                    e.dataTransfer.setData('text/plain', component.textContent);
                });
            });
            
            designerArea.addEventListener('dragover', function(e) {
                e.preventDefault();
            });
            
            designerArea.addEventListener('drop', function(e) {
                e.preventDefault();
                const componentType = e.dataTransfer.getData('text/plain');
                const element = document.createElement('div');
                element.className = 'form-element';
                element.textContent = componentType + ' (设计中...)';
                designerArea.appendChild(element);
            });
        });
    </script>
</body>
</html>
