name: Foundation CI W12 (5-Job DAG)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VER: "20.18"

jobs:
  backend-unit:
    name: backend-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: MedA/apps/agent-core
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: NOTOUCH v2 AC7 audit exit99
        run: |
          if [ -f scripts/notouch_v2_audit.py ]; then
            python scripts/notouch_v2_audit.py ${{ github.event.before || 'HEAD~1' }}
          else
            echo "NOTOUCH script not yet available, skipping audit"
          fi

      - name: Run backend unit tests (excl bench/e2e/needs_network)
        run: >
          uv run pytest tests
          --ignore=tests/test_w10_e2e_2preset.py
          --ignore=tests/test_w11_e2e_2preset_2000.py
          --ignore=tests/test_w12_e2e_2preset_10k_50k.py
          -m "not bench and not needs_network"
          --junitxml=unit-py${{ matrix.python-version }}.xml
          -p no:cacheprovider
          --no-header

      - name: Upload unit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-results-py${{ matrix.python-version }}
          path: MedA/apps/agent-core/*.xml

  backend-e2e-hp:
    name: backend-e2e-hp
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    needs: backend-unit
    defaults:
      run:
        working-directory: MedA/apps/agent-core
    env:
      TRAE_CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run HP11 E2E tests (needs_network + W11)
        run: >
          uv run pytest
          tests/test_w10_e2e_2preset.py
          tests/test_w11_e2e_2preset_2000.py
          -v
          --durations=0
          --runneedsnetwork
          --junitxml=e2e-hp11.xml
          -p no:cacheprovider

      - name: Run HP12 W12 E2E tests (10k/50k)
        run: >
          uv run pytest
          tests/test_w12_e2e_2preset_10k_50k.py
          -v
          --durations=0
          --junitxml=e2e-hp12.xml
          -p no:cacheprovider

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-hp-logs
          path: MedA/apps/agent-core/*.xml

  backend-benchmark:
    name: backend-benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: backend-unit
    continue-on-error: true
    defaults:
      run:
        working-directory: MedA/apps/agent-core
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run benchmark tests (@pytest.mark.bench, soft fail)
        id: bench
        continue-on-error: true
        run: |
          uv run pytest tests -m bench \
            --benchmark-min-rounds=3 \
            --benchmark-sort=Name \
            --benchmark-json=bench_result.json \
            --durations=0 \
            -p no:cacheprovider \
            --no-header 2>&1 | tee bench_stdout.log

      - name: Soft annotate PR with bench summary
        if: always()
        run: |
          echo "### Benchmark Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f bench_result.json ]; then
            python -c "
          import json, sys
          try:
              d = json.load(open('bench_result.json'))
              SLO = {'n500': 1.0, 'n1000': 1.5, 'n2000': 3.0, 'n10000': 9.6, 'n50000': 45.0}
              print('| Benchmark | Median (s) | SLO (s) | Ratio | Status |')
              print('|---|---|---|---|---|')
              for b in d.get('benchmarks', []):
                  nm = b['name']
                  med = b['stats']['median']
                  status = 'PASS'
                  for sz, t in SLO.items():
                      if sz in nm:
                          ratio = med / t
                          status = 'HARD' if ratio > 2.0 else ('WARN' if ratio > 1.0 else 'PASS')
                          print(f'| {nm} | {med:.3f} | {t:.1f} | {ratio:.2f}x | {status} |')
                          break
          except Exception as e:
              print(f'Parse error: {e}')
          " >> $GITHUB_STEP_SUMMARY
          else
            echo "No bench result available." >> $GITHUB_STEP_SUMMARY
          fi

      - name: HARD exit 99 if median > 2x SLO bound
        if: always()
        run: |
          python -c "
          import json, sys, glob
          files = glob.glob('bench_result.json')
          if not files:
              print('WARN: no bench artifact found, skipping hard fail check')
              sys.exit(0)
          SLO = {'n500': 1000, 'n1000': 1500, 'n2000': 3000, 'n10000': 9600, 'n50000': 45000}
          hard_fail = False
          for f in files:
              with open(f) as fh:
                  data = json.load(fh)
              for b in data.get('benchmarks', []):
                  nm = b['name']
                  med_ms = b['stats']['median'] * 1000
                  for sz, t_ms in SLO.items():
                      if sz in nm:
                          ratio = med_ms / t_ms
                          print(f'{nm}: median={med_ms:.0f}ms SLO={t_ms}ms ratio={ratio:.2f}x')
                          if ratio > 2.0:
                              print(f'  HARD BLOCK: 2x SLO exceeded ({ratio:.2f}x > 2.0x)')
                              hard_fail = True
          if hard_fail:
              print('HARD FAILURE: one or more benchmarks > 2x SLO. Exiting 99.', file=sys.stderr)
              sys.exit(99)
          print('OK: all benchmarks within 2x SLO threshold')
          "

      - name: Serialize benchmark artifact JSON
        if: always()
        run: |
          python -c "
          import json, os, datetime
          sha = '${{ github.sha }}'[:8]
          out = {
            'sha': '${{ github.sha }}',
            'commit_msg': '${{ github.event.head_commit.message }}'[:80] if '${{ github.event.head_commit.message }}' else '',
            'branch': '${{ github.ref_name }}',
            'run_at': datetime.datetime.utcnow().isoformat() + 'Z',
            'python': '3.12',
            'os': 'ubuntu-24.04',
          }
          if os.path.exists('bench_result.json'):
              d = json.load(open('bench_result.json'))
              SLO_SIZES = ['n500','n1000','n2000','n10000','n50000']
              for b in d.get('benchmarks', []):
                  nm = b['name']
                  for sz in SLO_SIZES:
                      if sz in nm:
                          out[f'{sz}_median_ms'] = int(b['stats']['median']*1000)
                          out[f'{sz}_p95_ms'] = int(b['stats']['iqr_end']*1000) if 'iqr_end' in b['stats'] else int(b['stats']['median']*1100)
          out_f = f'meda_bench_{{sha}}.json'
          with open(out_f, 'w') as f:
              json.dump(out, f)
          print(f'Wrote {out_f}')
          "

      - name: Upload bench artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-result-${{ github.sha }}
          path: |
            MedA/apps/agent-core/bench_result.json
            MedA/apps/agent-core/bench_stdout.log
            MedA/apps/agent-core/meda_bench_*.json
          retention-days: 90

  frontend-vitest:
    name: frontend-vitest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VER }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VER }}

      - name: Install dependencies with npm ci
        run: npm ci

      - name: Run shared-ui vitest (4 Dashboard 68 + barrel smoke 12)
        run: npm --workspace MedA/packages/shared-ui run test -- --run --reporter=junit --outputFile.junit=vitest-shared-ui.xml

      - name: Run shared-sdk vitest
        run: npm --workspace MedA/packages/shared-sdk run test -- --run --reporter=junit --outputFile.junit=vitest-shared-sdk.xml

      - name: Run apps/admin vitest
        run: npm --workspace MedA/apps/admin run test -- --run --reporter=junit --outputFile.junit=vitest-admin.xml

      - name: Run apps/web vitest
        run: npm --workspace MedA/apps/web run test -- --run --reporter=junit --outputFile.junit=vitest-web.xml

      - name: Run apps/desktop vitest
        run: npm --workspace MedA/apps/desktop run test -- --run --reporter=junit --outputFile.junit=vitest-desktop.xml

      - name: Upload vitest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitest-results
          path: "**/vitest-*.xml"

  deploy-dashboard:
    name: deploy-dashboard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [backend-benchmark, frontend-vitest]
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Download all bench artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bench-result-*
          path: /tmp/bench_artifacts
          merge-multiple: true

      - name: Run serialize_bench_history.py
        run: |
          cd MedA/apps/agent-core
          uv sync --frozen
          mkdir -p ../../../gh-pages-build/bench
          if [ -f scripts/serialize_bench_history.py ]; then
            uv run python scripts/serialize_bench_history.py /tmp/bench_artifacts ../../../gh-pages-build/bench
          else
            echo "serialize_bench_history.py not available yet, creating stub output"
            python -c "
            import json, datetime, os
            os.makedirs('../../../gh-pages-build/bench', exist_ok=True)
            payload = {'generated_at': datetime.datetime.utcnow().isoformat()+'Z', 'window_days': 7, 'entries': []}
            with open('../../../gh-pages-build/bench/history_7d.json','w') as f:
                json.dump(payload, f)
            payload['window_days']=60
            with open('../../../gh-pages-build/bench/history_60d.json','w') as f:
                json.dump(payload, f)
            "
          fi

      - name: Copy static dashboard index.html
        run: |
          mkdir -p gh-pages-build/bench
          cp MedA/docs/bench/index.html gh-pages-build/bench/index.html

      - name: Deploy to GitHub Pages via peaceiris/actions-gh-pages@v4
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-build
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
