<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
:root {
  --bg: #0f172a;
  --bg2: #1e293b;
  --bg3: #334155;
  --border: rgba(255,255,255,0.08);
  --text: #e2e8f0;
  --text-muted: rgba(255,255,255,0.45);
  --blue: #3b82f6;
  --teal: #14b8a6;
  --orange: #f59e0b;
  --purple: #a855f7;
  --pink: #ec4899;
  --green: #22c55e;
  --red: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: 'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh;
}

/* ===== HEADER ===== */
.hd {
  background: linear-gradient(135deg,#0f172a,#1e3a5f);
  border-bottom: 1px solid var(--border);
  padding: 20px 24px 16px;
  position: sticky; top: 0; z-index: 100;
}
.hd-top { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.hd-title { font-size:1.4rem; font-weight:800;
  background:linear-gradient(90deg,#60a5fa,#a78bfa,#34d399);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent; }
.hd-sub { font-size:0.78rem; color:var(--text-muted); margin-top:3px; }
.stat-pills { display:flex; gap:8px; flex-wrap:wrap; }
.sp { padding:3px 12px; border-radius:12px; font-size:0.75rem; font-weight:600; }
.sp-blue   { background:rgba(59,130,246,0.2);  color:#93c5fd; }
.sp-teal   { background:rgba(20,184,166,0.2);  color:#5eead4; }
.sp-orange { background:rgba(245,158,11,0.2);  color:#fbbf24; }
.sp-purple { background:rgba(168,85,247,0.2);  color:#d8b4fe; }
.sp-pink   { background:rgba(236,72,153,0.2);  color:#fbcfe8; }

/* ===== CONTROLS ===== */
.controls {
  padding: 12px 24px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  position: sticky; top: 84px; z-index: 99;
}
.ctrl-btn {
  padding: 5px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: rgba(255,255,255,0.05); color: var(--text-muted);
  cursor: pointer; font-size: 0.78rem; font-weight: 600;
  transition: all .15s;
}
.ctrl-btn:hover, .ctrl-btn.active {
  background: rgba(255,255,255,0.12); color: var(--text);
  border-color: rgba(255,255,255,0.2);
}
.ctrl-btn.proj-blue.active   { background:rgba(59,130,246,0.25); color:#93c5fd; border-color:#3b82f6; }
.ctrl-btn.proj-teal.active   { background:rgba(20,184,166,0.25); color:#5eead4; border-color:#14b8a6; }
.ctrl-btn.proj-orange.active { background:rgba(245,158,11,0.25); color:#fbbf24; border-color:#f59e0b; }
.ctrl-btn.proj-purple.active { background:rgba(168,85,247,0.25); color:#d8b4fe; border-color:#a855f7; }
.ctrl-btn.proj-pink.active   { background:rgba(236,72,153,0.25); color:#fbcfe8; border-color:#ec4899; }
.ctrl-search {
  padding: 5px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: rgba(255,255,255,0.05); color: var(--text);
  font-size: 0.78rem; outline: none; width: 180px;
}
.ctrl-search:focus { border-color: rgba(255,255,255,0.3); }
.ctrl-sep { color: var(--text-muted); font-size: 0.75rem; margin: 0 4px; }
#resultCount { font-size:0.75rem; color:var(--text-muted); margin-left:auto; }

/* ===== MONTH BLOCK ===== */
.month-block { margin: 0; }
.month-header {
  padding: 14px 24px 10px;
  background: linear-gradient(90deg,rgba(255,255,255,0.04),transparent);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  position: sticky; top: 130px; z-index: 50;
  background: var(--bg);
}
.month-name { font-size: 1.05rem; font-weight: 800; color: var(--text); }
.month-badge { font-size: 0.72rem; padding: 2px 10px; border-radius: 10px; }
.month-count { font-size: 0.75rem; color: var(--text-muted); margin-left: auto; }

/* ===== WEEK BLOCK ===== */
.week-block { }
.week-header {
  padding: 8px 24px;
  background: rgba(255,255,255,0.02);
  border-bottom: 1px solid rgba(255,255,255,0.04);
  font-size: 0.72rem; color: var(--text-muted); font-weight: 600;
  letter-spacing: .05em;
}

/* ===== DAY ROW ===== */
.day-row {
  display: grid;
  grid-template-columns: 100px 1fr;
  min-height: 48px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  transition: background .12s;
}
.day-row:hover { background: rgba(255,255,255,0.025); }
.day-row.weekend .day-info { opacity: 0.55; }
.day-row.today .day-info { background: rgba(251,191,36,0.08); }
.day-row.today .day-num { color: #fbbf24 !important; }
.day-row[data-hidden="true"] { display: none; }

.day-info {
  padding: 8px 14px 8px 24px;
  border-right: 1px solid rgba(255,255,255,0.06);
  display: flex; flex-direction: column; justify-content: center;
}
.day-num { font-size: 1rem; font-weight: 700; color: var(--text); line-height:1.1; }
.day-wk  { font-size: 0.7rem; color: var(--text-muted); }
.day-tasks { padding: 8px 14px 8px 16px; display: flex; flex-wrap: wrap; gap: 5px; align-items: flex-start; align-content: flex-start; }

/* ===== TASK TAG ===== */
.task {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px 3px 8px;
  border-radius: 6px;
  font-size: 0.76rem; font-weight: 500;
  cursor: default;
  transition: transform .12s;
  border: 1px solid transparent;
}
.task:hover { transform: translateY(-1px); }
.task .dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }

.task.t-blue   { background:rgba(59,130,246,0.15);  color:#93c5fd; border-color:rgba(59,130,246,0.3); }
.task.t-blue   .dot { background:#3b82f6; }
.task.t-teal   { background:rgba(20,184,166,0.15);  color:#5eead4; border-color:rgba(20,184,166,0.3); }
.task.t-teal   .dot { background:#14b8a6; }
.task.t-orange { background:rgba(245,158,11,0.15);  color:#fbbf24; border-color:rgba(245,158,11,0.3); }
.task.t-orange .dot { background:#f59e0b; }
.task.t-purple { background:rgba(168,85,247,0.15);  color:#d8b4fe; border-color:rgba(168,85,247,0.3); }
.task.t-purple .dot { background:#a855f7; }
.task.t-pink   { background:rgba(236,72,153,0.15);  color:#fbcfe8; border-color:rgba(236,72,153,0.3); }
.task.t-pink   .dot { background:#ec4899; }
.task.t-milestone { border-width:2px; font-weight:700; }
.task.t-milestone.t-blue   { border-color:#3b82f6; background:rgba(59,130,246,0.25); }
.task.t-milestone.t-teal   { border-color:#14b8a6; background:rgba(20,184,166,0.25); }
.task.t-milestone.t-orange { border-color:#f59e0b; background:rgba(245,158,11,0.25); }
.task.t-milestone.t-purple { border-color:#a855f7; background:rgba(168,85,247,0.25); }
.task.t-milestone.t-pink   { border-color:#ec4899; background:rgba(236,72,153,0.25); }

/* hidden */
.task[data-hidden="true"] { display:none; }

/* ===== empty day ===== */
.day-empty { color:var(--text-muted); font-size:0.72rem; padding-top:2px; }

/* ===== scrollbar ===== */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:3px; }

@media (max-width:640px) {
  .day-row { grid-template-columns: 72px 1fr; }
  .controls { top: 80px; }
  .month-header { top: 120px; }
}
</style>

// ============================================================
// UTIL
// ============================================================
const WEEKDAYS = ['日','一','二','三','四','五','六'];
const MONTHS = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const MONTH_THEMES = {
  4:  {label:'启动期', bg:'rgba(16,185,129,0.15)', color:'#34d399'},
  5:  {label:'深入推进', bg:'rgba(59,130,246,0.15)', color:'#60a5fa'},
  6:  {label:'阶段收束', bg:'rgba(245,158,11,0.15)', color:'#fbbf24'},
  7:  {label:'核心攻坚', bg:'rgba(239,68,68,0.15)', color:'#f87171'},
  8:  {label:'全面提升', bg:'rgba(168,85,247,0.15)', color:'#d8b4fe'},
  9:  {label:'冲刺验证', bg:'rgba(236,72,153,0.15)', color:'#fbcfe8'},
  10: {label:'集成整合', bg:'rgba(99,102,241,0.15)', color:'#a5b4fc'},
  11: {label:'逐一发布', bg:'rgba(20,184,166,0.15)', color:'#5eead4'},
  12: {label:'全量上线·收官', bg:'rgba(250,204,21,0.15)', color:'#fde047'},
};

function parseDate(s) {
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate()+n);
  return r;
}

// ============================================================
// BUILD CALENDAR
// ============================================================
const START = new Date(2026,3,10);
const END   = new Date(2026,11,31);
const TODAY = new Date(2026,3,10); // pinned to plan start

// group tasks by date
const taskByDate = {};
for (const t of TASKS) {
  if (!taskByDate[t[0]]) taskByDate[t[0]] = [];
  taskByDate[t[0]].push(t);
}

// group dates by month
const monthDays = {};
let cur = new Date(START);
while (cur <= END) {
  const m = cur.getMonth()+1;
  if (!monthDays[m]) monthDays[m] = [];
  monthDays[m].push(new Date(cur));
  cur = addDays(cur, 1);
}

let html = '';
for (const [mo, days] of Object.entries(monthDays)) {
  const m = Number(mo);
  const theme = MONTH_THEMES[m] || {};
  const taskCount = days.reduce((s,d)=>(taskByDate[fmtDate(d)]||[]).length+s, 0);
  html += `<div class="month-block" data-month="${m}">`;
  html += `<div class="month-header">
    <span class="month-name">${m}月 · ${MONTHS[m-1]}</span>
    <span class="month-badge" style="background:${theme.bg};color:${theme.color};">${theme.label||''}</span>
    <span class="month-count">${taskCount} 个任务</span>
  </div>`;

  // group by week
  let wk = null;
  for (const day of days) {
    const dow = day.getDay();
    const weekNum = getWeekNum(day);
    if (weekNum !== wk) {
      if (wk !== null) html += '</div>';
      wk = weekNum;
      const mon = getWeekMonday(day);
      const sun = addDays(mon, 6);
      html += `<div class="week-block">`;
      html += `<div class="week-header">第 ${weekNum} 周 &nbsp;·&nbsp; ${fmtShort(mon)} — ${fmtShort(sun)}</div>`;
    }
    const ds = fmtDate(day);
    const tasks = taskByDate[ds] || [];
    const isWeekend = dow === 0 || dow === 6;
    const isToday = ds === '2026-04-10';
    html += `<div class="day-row${isWeekend?' weekend':''}${isToday?' today':''}" data-date="${ds}">`;
    html += `<div class="day-info"><div class="day-num">${day.getDate()}</div><div class="day-wk">周${WEEKDAYS[dow]}</div></div>`;
    html += `<div class="day-tasks">`;
    if (tasks.length === 0) {
      if (!isWeekend) html += `<span class="day-empty">—</span>`;
    } else {
      for (const t of tasks) {
        const proj = t[1];
        const text = t[2];
        const ms = t[3] === 'true' ? ' t-milestone' : '';
        html += `<span class="task t-${proj}${ms}" data-proj="${proj}" data-text="${text.toLowerCase()}">`;
        html += `<span class="dot"></span>${text}</span>`;
      }
    }
    html += `</div></div>`;
  }
  if (wk !== null) html += '</div>';
  html += '</div>';
}

document.getElementById('calendar').innerHTML = html;

function getWeekNum(d) {
  const jan1 = new Date(d.getFullYear(), 0, 1);
  return Math.ceil((((d - jan1) / 86400000) + jan1.getDay() + 1) / 7);
}
function getWeekMonday(d) {
  const r = new Date(d);
  const day = r.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  r.setDate(r.getDate() + diff);
  return r;
}
function fmtShort(d) {
  return `${d.getMonth()+1}/${d.getDate()}`;
}

// ============================================================
// FILTER & SEARCH
// ============================================================
let activeFilters = new Set(['blue','teal','orange','purple','pink','milestone']);

function toggleFilter(btn) {
  const f = btn.dataset.filter;
  if (activeFilters.has(f)) {
    activeFilters.delete(f);
    btn.classList.remove('active');
  } else {
    activeFilters.add(f);
    btn.classList.add('active');
  }
  applyFilters();
}

function doSearch(val) {
  applyFilters(val.toLowerCase().trim());
}

function applyFilters(search = document.getElementById('searchBox').value.toLowerCase().trim()) {
  const tasks = document.querySelectorAll('.task');
  let shown = 0;
  tasks.forEach(t => {
    const proj = t.dataset.proj;
    const text = t.dataset.text;
    const isMilestone = t.classList.contains('t-milestone');
    const projOk = activeFilters.has(proj);
    const msOk = !isMilestone || activeFilters.has('milestone');
    const searchOk = !search || text.includes(search);
    const hide = !projOk || !msOk || !searchOk;
    t.dataset.hidden = hide ? 'true' : 'false';
    if (!hide) shown++;
  });

  // hide day rows with no visible tasks
  document.querySelectorAll('.day-row').forEach(row => {
    const visible = row.querySelectorAll('.task:not([data-hidden="true"])');
    const isEmpty = row.querySelector('.day-empty');
    const isWeekend = row.classList.contains('weekend');
    if (visible.length === 0 && !isEmpty && !isWeekend) {
      row.dataset.hidden = 'true';
    } else if (visible.length === 0 && isWeekend) {
      row.dataset.hidden = 'true';
    } else {
      row.dataset.hidden = 'false';
    }
  });

  document.getElementById('resultCount').textContent = shown > 0 ? `显示 ${shown} 个任务` : (search ? '无匹配结果' : '');
}
