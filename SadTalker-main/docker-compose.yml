services:
  sadtalker:
    build: .
    container_name: sadtalker-webui
    ports:
      - "7860:7860"
    environment:
      # 设置环境变量允许外部访问，不需要在代码写死 share=True
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      # 映射当前目录到容器，方便直接修改代码
      - .:/app
      # 映射 TTS 模型目录，防止每次重启丢失下载的模型
      - ./tts_models:/root/.local/share/tts
      # 防止本地生成的 venv 环境或者缓存污染 Docker 容器内部
      - /app/venv
      - /app/__pycache__
    # 如果您的机器支持 NVIDIA GPU 并且安装了 nvidia-container-toolkit，可开启以下配置
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # 重启策略
    restart: unless-stopped
